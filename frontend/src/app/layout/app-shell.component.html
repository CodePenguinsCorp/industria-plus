<div class="shell">
  <header class="shell__header">
    <a class="shell__brand" routerLink="/" aria-label="Industria Plus — início">
      <span class="shell__brand-mark" aria-hidden="true">IP</span>
      <span>
        <strong>{{ title }}</strong>
        <small>Manutenção industrial</small>
      </span>
    </a>

    <nav class="shell__nav" aria-label="Navegação principal">
      @for (item of navigation; track item.route) {
        <a
          [routerLink]="item.route"
          routerLinkActive="is-active"
          [routerLinkActiveOptions]="{ exact: item.exact }"
        >
          {{ item.label }}
        </a>
      }
    </nav>
  </header>

  <main class="shell__content">
    <router-outlet />
  </main>
</div>
